<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#11152D">
  <title>たとえあわせ｜参加QR</title>
  <style>
    :root{--ink:#11152D;--surface:#1C223E;--line:#343B5A;--white:#fff;--muted:#A8AEC4;--accent:#FFD43B}
    *{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
    main{max-width:480px;margin:auto;min-height:100svh;padding:calc(env(safe-area-inset-top) + 28px) 18px calc(env(safe-area-inset-bottom) + 28px);display:flex;flex-direction:column;align-items:center}
    h1{font-size:26px;margin:0 0 8px}.sub{color:var(--muted);text-align:center;line-height:1.5}.card{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:18px;text-align:center}
    img{width:min(76vw,320px);height:min(76vw,320px);background:#fff;border-radius:16px;padding:10px}.code{font-size:36px;letter-spacing:6px;font-weight:900;color:var(--accent);margin-top:16px}.hint{color:var(--muted);font-size:12px;line-height:1.6;margin-top:10px}
  </style>
</head>
<body>
<main>
  <h1>たとえあわせ</h1>
  <div class="sub">参加する人はQRコードを読み取ってください</div>
  <div class="card">
    <img id="qr" alt="参加QRコード">
    <div id="code" class="code"></div>
    <div class="hint">QRが読めない場合は、参加ページでこの6桁コードを入力してください。</div>
  </div>
</main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const room = (params.get('room') || '').trim().toUpperCase().slice(0,6);
  const joinUrl = location.origin + '/tatoeawase-support/remote/?room=' + encodeURIComponent(room);
  document.getElementById('code').textContent = room || '------';
  document.getElementById('qr').src =
    'https://api.qrserver.com/v1/create-qr-code/?size=320x320&margin=8&data=' +
    encodeURIComponent(joinUrl);
})();
</script>
</body>
</html>
