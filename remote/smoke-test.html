<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#11152D">
  <title>たとえあわせ Remote Smoke Test</title>
  <style>
    :root{--ink:#11152D;--surface:#1C223E;--line:#343B5A;--white:#fff;--muted:#A8AEC4;--accent:#FFD43B;--ok:#62E8A4;--bad:#FF8BA7}
    *{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
    main{max-width:560px;margin:auto;min-height:100svh;padding:calc(env(safe-area-inset-top) + 24px) 18px calc(env(safe-area-inset-bottom) + 28px)}
    h1{font-size:25px;margin:0 0 8px}p{color:var(--muted);line-height:1.6}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}
    button{width:100%;min-height:54px;border:0;border-radius:15px;background:var(--accent);color:var(--ink);font-size:16px;font-weight:900}
    button:disabled{opacity:.45}.step{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.step:last-child{border:0}.ok{color:var(--ok);font-weight:900}.bad{color:var(--bad);font-weight:900}.muted{color:var(--muted)}
    pre{white-space:pre-wrap;word-break:break-word;background:#0D1024;border-radius:14px;padding:12px;min-height:80px;font-size:11px}
  </style>
</head>
<body>
<main>
  <h1>Remote Smoke Test</h1>
  <p>Firebaseの認証・Security Rules・3人ルーム・秘密回答・クリーンアップを1台で自動確認します。実データはテスト終了時に削除します。</p>
  <div class="card">
    <button id="run">テスト開始</button>
    <div id="steps"></div>
  </div>
  <pre id="log">未実行</pre>
</main>
<script src="./config.js"></script>
<script src="./smoke-test.js"></script>
</body>
</html>
